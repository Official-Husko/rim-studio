[package]
name = "ipc-lab"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
iso = ["tauri/isolation"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["custom-protocol", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
rmp-serde = "1.3.1"
webkit2gtk-sys = "=2.0.2"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false
