[package]
name = "vdfbench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
keyvalues-parser = "=0.2.4"
keyvalues-serde = "=0.2.4"
steamlocate = "=2.1.1"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3

[[bin]]
name = "vdfbench"
path = "src/main.rs"

[[bin]]
name = "compare"
path = "src/bin_compare.rs"
