[package]
name = "rimstudio-perf-spike"
version = "0.1.0"
edition = "2024"
publish = false
description = "Throwaway benchmark: scan and index speed of a RimWorld mod library (RimStudio research spike)"

# Keep this project self-contained even when it sits inside another repository.
[workspace]

[features]
# Counting global allocator for exact heap numbers (stage S5). Off for all timing runs.
alloc-count = []

[dependencies]
rayon = "1.12"
walkdir = "2.5"
jwalk = "0.9"
ignore = "0.4.33"
quick-xml = { version = "0.42", features = ["serialize"] }
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "=2.0.1", features = ["serde"] }
rkyv = "0.8.18"
rusqlite = { version = "0.40", features = ["bundled"] }
memchr = "2.8"
memmap2 = "0.9"
libc = "0.2"
blake3 = { version = "1.8", features = ["rayon"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2.1"
lasso = { version = "0.7.3", features = ["multi-threaded"] }
sonic-rs = "0.5.10"
simd-json = "0.18.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
