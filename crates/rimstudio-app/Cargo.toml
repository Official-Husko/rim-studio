[package]
name = "rimstudio-app"
description = "Composition root, command registry and dispatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.rimstudio]
layer = "l4-app"

[lints]
workspace = true

[dependencies]
rimstudio-core.workspace = true
rimstudio-io.workspace = true
rimstudio-xml.workspace = true
rimstudio-defs.workspace = true
rimstudio-design.workspace = true
rimstudio-platform.workspace = true
rimstudio-steam.workspace = true
rimstudio-library.workspace = true
rimstudio-workspace.workspace = true
rimstudio-toolkit.workspace = true
rimstudio-manager.workspace = true
rimstudio-ipc-types.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
camino.workspace = true
thiserror.workspace = true
anyhow.workspace = true
blake3.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript bindings of the app owned DTOs (used by the bindings test, never in shipped binaries).
ts = ["dep:ts-rs", "rimstudio-ipc-types/ts"]

[dev-dependencies]
rimstudio-testing.workspace = true
tempfile.workspace = true
rstest.workspace = true
# Turns on the `ts` feature for the test targets only.
rimstudio-app = { workspace = true, features = ["ts"] }
