[package]
name = "rimstudio-devserver"
description = "Development bridge: a loopback HTTP server that lets the browser UI call the real backend (never packaged)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.rimstudio]
layer = "l4-shell"

[lints]
workspace = true

[lib]
name = "rimstudio_devserver"
path = "src/lib.rs"

[[bin]]
name = "rimstudio-devserver"
path = "src/main.rs"

[dependencies]
rimstudio-app.workspace = true
rimstudio-ipc-types.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
rimstudio-testing.workspace = true
tempfile.workspace = true
