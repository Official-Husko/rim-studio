[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
# The licence is custom and will be added later (owner decision D-067): no `license` field on purpose.

[workspace.dependencies]
# internal crates
rimstudio-core = { path = "crates/rimstudio-core" }
rimstudio-xml = { path = "crates/rimstudio-xml" }
rimstudio-io = { path = "crates/rimstudio-io" }
rimstudio-platform = { path = "crates/rimstudio-platform" }
rimstudio-xpath = { path = "crates/rimstudio-xpath" }
rimstudio-defs = { path = "crates/rimstudio-defs" }
rimstudio-design = { path = "crates/rimstudio-design" }
rimstudio-steam = { path = "crates/rimstudio-steam" }
rimstudio-library = { path = "crates/rimstudio-library" }
rimstudio-workspace = { path = "crates/rimstudio-workspace" }
rimstudio-toolkit = { path = "crates/rimstudio-toolkit" }
rimstudio-manager = { path = "crates/rimstudio-manager" }
rimstudio-ipc-types = { path = "crates/rimstudio-ipc-types" }
rimstudio-app = { path = "crates/rimstudio-app" }
rimstudio-testing = { path = "crates/rimstudio-testing" }

# data
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
serde_path_to_error = "0.1.20"
jsonc-parser = { version = "0.34.0", features = ["serde", "cst"] }
quick-xml = "0.42.0"            # only rimstudio-xml may depend on this (invariant I-02)
# filesystem and concurrency
rayon = "1.12.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
ignore = "0.4.33"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
same-file = "1.0.6"
dunce = "1.0.5"
camino = { version = "1.2.6", features = ["serde1"] }
fs-err = "3.3.2"
tempfile = "3.27.0"
atomic-write-file = "0.3.1"
blake3 = "1.8.7"
rustc-hash = "2.1.3"
sys-locale = "0.3.2"
winreg = "0.56.0"
# errors, logging, cli
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
clap = { version = "4.6.7", features = ["derive"] }
# tests (dev only)
proptest = "1.11.0"
rstest = "0.27.0"
goldenfile = "1.11.0"
steamlocate = "2.1.1"
keyvalues-parser = "0.2.4"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
